server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Assistant answers stream as server-sent events: pass each event through as it arrives.
  # The longest matching prefix wins, so this applies before the general /api/ block.
  location /api/assistant/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # Longer than the 60 s turn deadline; heartbeats keep the connection busy meanwhile
    proxy_read_timeout 90s;
  }

  # API requests go to the backend container (service "api" in docker-compose.yml)
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached for a long time
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes such as /resorts/:id all serve the React app
  location / {
    try_files $uri /index.html;
  }
}
