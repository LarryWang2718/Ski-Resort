# Docker's DNS: look the API copies up again every few seconds, so stopped ones drop out and new ones join
resolver 127.0.0.11 valid=5s ipv6=off;

# Every copy of the "api" service in docker-compose.yml
upstream api {
  # Shared by all nginx workers, so they balance as one instead of each rotating on its own
  zone api 64k;
  # Answers stream for seconds: send each request to the copy with the fewest open ones
  least_conn;
  server api:5000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # A connect inside the Docker network takes well under a millisecond, so a copy that has gone
  # away should cost 2 s before nginx tries another, not the 60 s default
  proxy_connect_timeout 2s;

  # Assistant answers stream as server-sent events: pass each event through as it arrives.
  # The longest matching prefix wins, so this applies before the general /api/ block.
  location /api/assistant/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # Longer than the 60 s turn deadline; heartbeats keep the connection busy meanwhile
    proxy_read_timeout 90s;
  }

  # API requests go to the backend containers
  location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached for a long time
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes such as /resorts/:id all serve the React app
  location / {
    try_files $uri /index.html;
  }
}
